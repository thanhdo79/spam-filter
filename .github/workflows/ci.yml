name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kiem-thu:
    name: Chay kiem thu pytest
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt

      - name: Cai thu vien
        run: pip install -r requirements-dev.txt

      - name: Chay pytest
        run: python -m pytest -v

  dung-docker:
    name: Dung thu image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t spam-filter-api:ci .